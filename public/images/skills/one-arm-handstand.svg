<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBE7DF; }
      .grid { stroke: #D8D2C6; stroke-width: 1; stroke-dasharray: 4 6; }
      .hairline { stroke: #111111; stroke-width: 0.75; opacity: 0.35; }
      .badge-bg { fill: #111111; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 10px; fill: #FAF9F6; letter-spacing: 0.12em; text-transform: uppercase; }
      .title-serif { font-family: 'Times New Roman', Times, serif; font-size: 26px; fill: #111111; font-style: italic; }
      .meta-mono { font-family: ui-monospace, monospace; font-size: 11px; fill: #6B6862; letter-spacing: 0.15em; }
    </style>
  </defs>

  <rect width="900" height="1200" class="bg" />

  <!-- Technical grid -->
  <line x1="90" y1="0" x2="90" y2="1200" class="grid" />
  <line x1="810" y1="0" x2="810" y2="1200" class="grid" />
  <line x1="0" y1="144" x2="900" y2="144" class="grid" />
  <line x1="0" y1="1056" x2="900" y2="1056" class="grid" />

  <!-- Concentric focus circle -->
  <circle cx="450" cy="600" r="252.00000000000003" class="hairline" stroke-dasharray="4 8" />

  <!-- Biomechanical drawing -->
  
      <!-- Ground line -->
      <line x1="280" y1="980" x2="620" y2="980" stroke="#111111" stroke-width="2" />
      <!-- Single Support Hand Centered -->
      <circle cx="450" cy="978" r="6" fill="#111111" />
      <!-- Support Arm -->
      <line x1="450" y1="978" x2="450" y2="760" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
      <!-- Free Arm Tucked/Extended -->
      <polyline points="450,760 380,720 340,680" fill="none" stroke="#6B6862" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />
      <!-- Angled Shoulder line (Side Tilt) -->
      <line x1="400" y1="740" x2="490" y2="770" stroke="#111111" stroke-width="3" />
      <!-- Counterbalance Straddle Legs -->
      <line x1="450" y1="560" x2="340" y2="340" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <line x1="450" y1="560" x2="560" y2="380" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <!-- Plumb line directly over base -->
      <line x1="450" y1="980" x2="450" y2="280" stroke="#6B6862" stroke-width="1.5" stroke-dasharray="5 5" />
      <text x="470" y="760" font-family="monospace" font-size="11" fill="#6B6862">LATERAL SHOULDER TILT 12°</text>
      <text x="470" y="560" font-family="monospace" font-size="11" fill="#6B6862">STRADDLE COUNTER-MASS</text>
    

  <!-- Header metadata -->
  <rect x="50" y="40" width="300" height="28" class="badge-bg" />
  <text x="65" y="58" class="badge-text">03 // ONE-ARM HANDSTAND</text>

  <text x="50" y="100" class="title-serif">Side Tilt & Unilateral Loading</text>
  <text x="50" y="120" class="meta-mono">SLOT: /images/skills/one-arm-handstand.jpg</text>

  <!-- Footer metadata -->
  <text x="50" y="1160" class="meta-mono">BODYWEIGHTLAB PROTOCOL // REPLACABLE ASSET</text>
  <text x="850" y="1160" class="meta-mono" text-anchor="end">900 x 1200 PX</text>
</svg>