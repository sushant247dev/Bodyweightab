<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBE7DF; }
      .grid { stroke: #D8D2C6; stroke-width: 1; stroke-dasharray: 4 6; }
      .hairline { stroke: #111111; stroke-width: 0.75; opacity: 0.35; }
      .badge-bg { fill: #111111; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 10px; fill: #FAF9F6; letter-spacing: 0.12em; text-transform: uppercase; }
      .title-serif { font-family: 'Times New Roman', Times, serif; font-size: 26px; fill: #111111; font-style: italic; }
      .meta-mono { font-family: ui-monospace, monospace; font-size: 11px; fill: #6B6862; letter-spacing: 0.15em; }
    </style>
  </defs>

  <rect width="900" height="1200" class="bg" />

  <!-- Technical grid -->
  <line x1="90" y1="0" x2="90" y2="1200" class="grid" />
  <line x1="810" y1="0" x2="810" y2="1200" class="grid" />
  <line x1="0" y1="144" x2="900" y2="144" class="grid" />
  <line x1="0" y1="1056" x2="900" y2="1056" class="grid" />

  <!-- Concentric focus circle -->
  <circle cx="450" cy="600" r="252.00000000000003" class="hairline" stroke-dasharray="4 8" />

  <!-- Biomechanical drawing -->
  
      <!-- Ground line -->
      <line x1="280" y1="980" x2="620" y2="980" stroke="#111111" stroke-width="2" />
      <!-- Hands wide -->
      <circle cx="340" cy="978" r="5" fill="#111111" />
      <circle cx="560" cy="978" r="5" fill="#111111" />
      <!-- Bent elbows 90 deg -->
      <polyline points="340,978 370,880 410,880" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <polyline points="560,978 530,880 490,880" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <!-- Head approaching triangle apex -->
      <circle cx="450" cy="930" r="16" fill="none" stroke="#111111" stroke-width="2" />
      <!-- Triangle dashed guide -->
      <polygon points="340,978 560,978 450,920" fill="none" stroke="#6B6862" stroke-width="1" stroke-dasharray="4 4" />
      <!-- Torso -->
      <line x1="450" y1="880" x2="450" y2="600" stroke="#111111" stroke-width="4" stroke-linecap="round" />
      <!-- Legs straight -->
      <line x1="450" y1="600" x2="450" y2="340" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
      <text x="470" y="890" font-family="monospace" font-size="11" fill="#6B6862">90° FOREARM VERTICAL</text>
      <text x="470" y="940" font-family="monospace" font-size="11" fill="#6B6862">TRIPOD HEAD PATH</text>
    

  <!-- Header metadata -->
  <rect x="50" y="40" width="300" height="28" class="badge-bg" />
  <text x="65" y="58" class="badge-text">02 // HANDSTAND PUSH-UP</text>

  <text x="50" y="100" class="title-serif">Eccentric Control & Concentric Drive</text>
  <text x="50" y="120" class="meta-mono">SLOT: /images/skills/handstand-pushup.jpg</text>

  <!-- Footer metadata -->
  <text x="50" y="1160" class="meta-mono">BODYWEIGHTLAB PROTOCOL // REPLACABLE ASSET</text>
  <text x="850" y="1160" class="meta-mono" text-anchor="end">900 x 1200 PX</text>
</svg>