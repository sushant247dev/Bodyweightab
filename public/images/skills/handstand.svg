<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBE7DF; }
      .grid { stroke: #D8D2C6; stroke-width: 1; stroke-dasharray: 4 6; }
      .hairline { stroke: #111111; stroke-width: 0.75; opacity: 0.35; }
      .badge-bg { fill: #111111; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 10px; fill: #FAF9F6; letter-spacing: 0.12em; text-transform: uppercase; }
      .title-serif { font-family: 'Times New Roman', Times, serif; font-size: 26px; fill: #111111; font-style: italic; }
      .meta-mono { font-family: ui-monospace, monospace; font-size: 11px; fill: #6B6862; letter-spacing: 0.15em; }
    </style>
  </defs>

  <rect width="900" height="1200" class="bg" />

  <!-- Technical grid -->
  <line x1="90" y1="0" x2="90" y2="1200" class="grid" />
  <line x1="810" y1="0" x2="810" y2="1200" class="grid" />
  <line x1="0" y1="144" x2="900" y2="144" class="grid" />
  <line x1="0" y1="1056" x2="900" y2="1056" class="grid" />

  <!-- Concentric focus circle -->
  <circle cx="450" cy="600" r="252.00000000000003" class="hairline" stroke-dasharray="4 8" />

  <!-- Biomechanical drawing -->
  
      <!-- Ground line -->
      <line x1="300" y1="980" x2="600" y2="980" stroke="#111111" stroke-width="2" />
      <!-- Hands -->
      <circle cx="380" cy="978" r="5" fill="#111111" />
      <circle cx="520" cy="978" r="5" fill="#111111" />
      <!-- Arms -->
      <line x1="380" y1="978" x2="410" y2="780" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <line x1="520" y1="978" x2="490" y2="780" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <!-- Shoulders -->
      <line x1="410" y1="780" x2="490" y2="780" stroke="#111111" stroke-width="3" />
      <!-- Plumb line -->
      <line x1="450" y1="980" x2="450" y2="240" stroke="#6B6862" stroke-width="1.5" stroke-dasharray="6 6" />
      <!-- Torso -->
      <line x1="450" y1="780" x2="450" y2="540" stroke="#111111" stroke-width="4" stroke-linecap="round" />
      <!-- Legs straight -->
      <line x1="450" y1="540" x2="450" y2="260" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
      <!-- Toes pointed -->
      <line x1="450" y1="260" x2="450" y2="220" stroke="#111111" stroke-width="2" />
      <!-- Vector angles -->
      <text x="470" y="600" font-family="monospace" font-size="11" fill="#6B6862">180° VERTICAL STACK</text>
      <text x="470" y="785" font-family="monospace" font-size="11" fill="#6B6862">ELEVATED SCAPULAE</text>
    

  <!-- Header metadata -->
  <rect x="50" y="40" width="300" height="28" class="badge-bg" />
  <text x="65" y="58" class="badge-text">01 // FREESTANDING HANDSTAND</text>

  <text x="50" y="100" class="title-serif">Axis Alignment & Scapular Lock</text>
  <text x="50" y="120" class="meta-mono">SLOT: /images/skills/handstand.jpg</text>

  <!-- Footer metadata -->
  <text x="50" y="1160" class="meta-mono">BODYWEIGHTLAB PROTOCOL // REPLACABLE ASSET</text>
  <text x="850" y="1160" class="meta-mono" text-anchor="end">900 x 1200 PX</text>
