<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBE7DF; }
      .grid { stroke: #D8D2C6; stroke-width: 1; stroke-dasharray: 4 6; }
      .hairline { stroke: #111111; stroke-width: 0.75; opacity: 0.35; }
      .badge-bg { fill: #111111; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 10px; fill: #FAF9F6; letter-spacing: 0.12em; text-transform: uppercase; }
      .title-serif { font-family: 'Times New Roman', Times, serif; font-size: 26px; fill: #111111; font-style: italic; }
      .meta-mono { font-family: ui-monospace, monospace; font-size: 11px; fill: #6B6862; letter-spacing: 0.15em; }
    </style>
  </defs>

  <rect width="1000" height="1000" class="bg" />

  <!-- Technical grid -->
  <line x1="100" y1="0" x2="100" y2="1000" class="grid" />
  <line x1="900" y1="0" x2="900" y2="1000" class="grid" />
  <line x1="0" y1="120" x2="1000" y2="120" class="grid" />
  <line x1="0" y1="880" x2="1000" y2="880" class="grid" />

  <!-- Concentric focus circle -->
  <circle cx="500" cy="500" r="280" class="hairline" stroke-dasharray="4 8" />

  <!-- Biomechanical drawing -->
  
      <!-- Floor contact -->
      <line x1="200" y1="780" x2="800" y2="780" stroke="#111111" stroke-width="2" />
      <!-- Hands -->
      <circle cx="450" cy="778" r="5" fill="#111111" />
      <circle cx="550" cy="778" r="5" fill="#111111" />
      <!-- Straight Arms into Protraction -->
      <line x1="450" y1="778" x2="465" y2="580" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <line x1="550" y1="778" x2="535" y2="580" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <!-- Elevated Hips over Shoulders -->
      <circle cx="500" cy="420" r="14" fill="none" stroke="#111111" stroke-width="2" />
      <!-- Torso vertical line -->
      <line x1="500" y1="580" x2="500" y2="420" stroke="#111111" stroke-width="4" stroke-linecap="round" />
      <!-- Wide Straddle Legs lifting smoothly -->
      <line x1="500" y1="420" x2="320" y2="600" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <line x1="500" y1="420" x2="680" y2="600" stroke="#111111" stroke-width="3" stroke-linecap="round" />
      <!-- Compression Arc -->
      <path d="M 400,660 Q 500,520 600,660" fill="none" stroke="#6B6862" stroke-width="1.5" stroke-dasharray="5 5" />
      <text x="520" y="430" font-family="monospace" font-size="11" fill="#6B6862">HIPS STACKED OVER PALMS</text>
      <text x="520" y="580" font-family="monospace" font-size="11" fill="#6B6862">MAXIMUM SCAPULAR PROTRACTION</text>
    

  <!-- Header metadata -->
  <rect x="50" y="40" width="300" height="28" class="badge-bg" />
  <text x="65" y="58" class="badge-text">04 // PRESS TO HANDSTAND</text>

  <text x="50" y="100" class="title-serif">Active Compression & Hip Elevation</text>
  <text x="50" y="120" class="meta-mono">SLOT: /images/skills/press-handstand.jpg</text>

  <!-- Footer metadata -->
  <text x="50" y="960" class="meta-mono">BODYWEIGHTLAB PROTOCOL // REPLACABLE ASSET</text>
  <text x="950" y="960" class="meta-mono" text-anchor="end">1000 x 1000 PX</text>
</svg>