<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBE7DF; }
      .grid { stroke: #D8D2C6; stroke-width: 1; stroke-dasharray: 4 6; }
      .hairline { stroke: #111111; stroke-width: 0.75; opacity: 0.35; }
      .badge-bg { fill: #111111; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 10px; fill: #FAF9F6; letter-spacing: 0.12em; text-transform: uppercase; }
      .title-serif { font-family: 'Times New Roman', Times, serif; font-size: 26px; fill: #111111; font-style: italic; }
      .meta-mono { font-family: ui-monospace, monospace; font-size: 11px; fill: #6B6862; letter-spacing: 0.15em; }
    </style>
  </defs>

  <rect width="1200" height="800" class="bg" />

  <!-- Technical grid -->
  <line x1="120" y1="0" x2="120" y2="800" class="grid" />
  <line x1="1080" y1="0" x2="1080" y2="800" class="grid" />
  <line x1="0" y1="96" x2="1200" y2="96" class="grid" />
  <line x1="0" y1="704" x2="1200" y2="704" class="grid" />

  <!-- Concentric focus circle -->
  <circle cx="600" cy="400" r="224.00000000000003" class="hairline" stroke-dasharray="4 8" />

  <!-- Biomechanical drawing -->
  
      <!-- Floor contact -->
      <line x1="160" y1="580" x2="1040" y2="580" stroke="#111111" stroke-width="2" />
      <!-- Torso vertical spine -->
      <line x1="600" y1="570" x2="600" y2="340" stroke="#111111" stroke-width="4" stroke-linecap="round" />
      <circle cx="600" cy="300" r="14" fill="none" stroke="#111111" stroke-width="2" />
      <!-- Full 180 deg split legs touching baseline -->
      <line x1="600" y1="570" x2="240" y2="576" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
      <line x1="600" y1="570" x2="960" y2="576" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
      <!-- Foot positions (rotated up/out) -->
      <circle cx="240" cy="576" r="5" fill="#111111" />
      <circle cx="960" cy="576" r="5" fill="#111111" />
      <!-- 180 deg indicator -->
      <path d="M 480,570 A 120 120 0 0 1 720 570" fill="none" stroke="#6B6862" stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="600" y="520" font-family="monospace" font-size="11" fill="#6B6862" text-anchor="middle">180.0° ACTIVE HIP ADDUCTION</text>
      <text x="600" y="420" font-family="monospace" font-size="11" fill="#6B6862" text-anchor="middle">NEUTRAL PELVIC TILT</text>
    

  <!-- Header metadata -->
  <rect x="50" y="40" width="300" height="28" class="badge-bg" />
  <text x="65" y="58" class="badge-text">06 // MIDDLE SPLITS</text>

  <text x="50" y="100" class="title-serif">Loaded End-Range Hip Adduction</text>
  <text x="50" y="120" class="meta-mono">SLOT: /images/skills/middle-splits.jpg</text>

  <!-- Footer metadata -->
  <text x="50" y="760" class="meta-mono">BODYWEIGHTLAB PROTOCOL // REPLACABLE ASSET</text>
  <text x="1150" y="760" class="meta-mono" text-anchor="end">1200 x 800 PX</text>
</svg>