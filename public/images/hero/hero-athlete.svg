<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBE7DF; }
      .grid-line { stroke: #D8D2C6; stroke-width: 1; stroke-dasharray: 4 6; }
      .axis-main { stroke: #111111; stroke-width: 1.5; }
      .hairline { stroke: #111111; stroke-width: 0.75; opacity: 0.4; }
      .figure { fill: none; stroke: #111111; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .figure-secondary { fill: none; stroke: #6B6862; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .label-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #6B6862; letter-spacing: 0.15em; text-transform: uppercase; }
      .label-serif { font-family: 'Times New Roman', Times, serif; font-size: 32px; fill: #111111; font-style: italic; }
      .badge { fill: #111111; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 11px; fill: #FAF9F6; letter-spacing: 0.1em; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="1600" class="bg" />

  <!-- Architectural Coordinate Grid -->
  <line x1="120" y1="0" x2="120" y2="1600" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="1600" class="axis-main" opacity="0.3" />
  <line x1="1080" y1="0" x2="1080" y2="1600" class="grid-line" />
  
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
  <line x1="0" y1="800" x2="1200" y2="800" class="axis-main" opacity="0.2" />
  <line x1="0" y1="1440" x2="1200" y2="1440" class="grid-line" />

  <!-- Subtle Concentric Calibration Circles -->
  <circle cx="600" cy="800" r="320" class="hairline" />
  <circle cx="600" cy="800" r="480" class="hairline" stroke-dasharray="3 9" />

  <!-- Geometric Handstand Line Representation (Plumb Line Stacking) -->
  <!-- Floor Contact -->
  <line x1="460" y1="1280" x2="740" y2="1280" stroke="#111111" stroke-width="2" />
  <!-- Hands -->
  <circle cx="520" cy="1276" r="6" fill="#111111" />
  <circle cx="680" cy="1276" r="6" fill="#111111" />
  
  <!-- Forearms & Arms Stacking to Shoulders -->
  <line x1="520" y1="1276" x2="550" y2="1080" class="figure" />
  <line x1="680" y1="1276" x2="650" y2="1080" class="figure" />
  <!-- Shoulders -->
  <line x1="550" y1="1080" x2="650" y2="1080" class="figure" />
  
  <!-- Torso & Core Hollow Stack -->
  <path d="M 550,1080 L 570,840 L 630,840 L 650,1080 Z" class="figure" stroke-width="2" />
  <!-- Spine Line -->
  <line x1="600" y1="1080" x2="600" y2="400" stroke="#111111" stroke-width="1.5" stroke-dasharray="8 8" />
  
  <!-- Pelvis & Legs Extending to Zenith -->
  <line x1="570" y1="840" x2="585" y2="580" class="figure" />
  <line x1="630" y1="840" x2="615" y2="580" class="figure" />
  <line x1="585" y1="580" x2="595" y2="380" class="figure" />
  <line x1="615" y1="580" x2="605" y2="380" class="figure" />
  <!-- Pointed Toes -->
  <line x1="595" y1="380" x2="600" y2="340" class="figure" />
  <line x1="605" y1="380" x2="600" y2="340" class="figure" />

  <!-- Degree & Balance Vector Markers -->
  <text x="620" y="810" class="label-mono">180.0° VERTICAL ALIGNMENT</text>
  <text x="620" y="1085" class="label-mono">ELEVATED SCAPULAR COMPLEX</text>
  <text x="620" y="1275" class="label-mono">PALMAR DEPRESSION AXIS</text>

  <!-- Editorial Metadata -->
  <rect x="80" y="80" width="360" height="34" class="badge" />
  <text x="100" y="102" class="badge-text">PLATE 01 // HERO ATHLETE COMPOSITION</text>

  <text x="80" y="150" class="label-serif">Precision. Balance. Stillness.</text>
  <text x="80" y="175" class="label-mono">ASSET SLOT: /public/images/hero/hero-athlete.jpg</text>

  <g transform="translate(80, 1500)">
    <text x="0" y="0" class="label-mono">BODYWEIGHTLAB ARCHIVE // 2026</text>
    <text x="1040" y="0" class="label-mono" text-anchor="end">3 : 4 RATIO // 1200 x 1600</text>
  </g>
</svg>
